name: Live site check

# Checks the live website: HTTPS, certificate, redirects, security headers,
# every page and the SEO files. Runs after each deploy, weekly, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check the live site
        shell: bash
        run: |
          set +e   # keep going after a failed check, so every problem is reported
          set -u
          SITE=crownsmere.com
          fail=0
          ok()   { echo "PASS  $*"; }
          bad()  { echo "FAIL  $*"; fail=1; }
          note() { echo "NOTE  $*"; }

          echo "== DNS"
          echo "A:     $(dig +short A $SITE | tr '\n' ' ')"
          echo "AAAA:  $(dig +short AAAA $SITE | tr '\n' ' ')"
          echo "www:   $(dig +short CNAME www.$SITE | tr '\n' ' ')"
          echo "MX:    $(dig +short MX $SITE | tr '\n' ' ')"
          echo "CAA:   $(dig +short CAA $SITE | tr '\n' ' ')"

          echo "== HTTPS and certificate"
          if curl -sS -o /dev/null --max-time 20 "https://$SITE/"; then
            ok "HTTPS works with a valid, trusted certificate"
          else
            bad "HTTPS failed: no valid certificate for $SITE yet. In Settings > Pages, re-save the custom domain and wait for GitHub to issue the certificate, then tick Enforce HTTPS"
          fi
          end=$(echo | openssl s_client -servername $SITE -connect $SITE:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$end" ]; then
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            subj=$(echo | openssl s_client -servername $SITE -connect $SITE:443 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | tail -1)
            echo "      certificate covers: $subj"
            if echo "$subj" | grep -q "DNS:$SITE"; then ok "certificate is issued for $SITE"; else bad "certificate is not for $SITE (GitHub is serving its default certificate)"; fi
            if [ "$days" -gt 14 ]; then ok "certificate valid for $days more days"; else bad "certificate expires in $days days"; fi
          fi

          echo "== Redirects"
          for u in "http://$SITE/" "http://www.$SITE/" "https://www.$SITE/"; do
            loc=$(curl -sk -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "$u")
            code=${loc%% *}; to=${loc#* }
            if [[ "$code" =~ ^30[1278]$ && "$to" == https://$SITE/* ]]; then ok "$u -> $to ($code)"
            else bad "$u should redirect to https://$SITE/ but returned: $loc  (turn on 'Enforce HTTPS' in Settings > Pages)"; fi
          done

          echo "== Security headers (https://$SITE/)"
          headers=$(curl -skSI --max-time 20 "https://$SITE/" | tr -d '\r')
          echo "$headers" | grep -iE '^(strict-transport-security|content-security-policy|x-content-type-options|x-frame-options|referrer-policy|server):' | sed 's/^/      /'
          if echo "$headers" | grep -qi '^strict-transport-security:'; then ok "HSTS header present"; else note "no HSTS header: GitHub Pages does not let sites add response headers; HTTPS is still enforced by the redirects above"; fi
          home=$(curl -skS --max-time 20 "https://$SITE/")   # read the whole page first (grep -q on a pipe can cut curl off)
          if grep -q 'http-equiv="Content-Security-Policy"' <<<"$home"; then ok "Content Security Policy present in the page"; else bad "Content Security Policy missing"; fi

          echo "== Pages"
          for p in / /services.html /about.html /contact.html /privacy.html /sitemap.xml /robots.txt /site.webmanifest /.well-known/security.txt /assets/img/og-image.jpg /assets/vendor/leaflet/leaflet.js /assets/vendor/crest.min.js /assets/vendor/lenis.min.js; do
            code=$(curl -sk -o /dev/null --max-time 20 -w '%{http_code}' "https://$SITE$p")
            if [ "$code" = 200 ]; then ok "$p ($code)"; else bad "$p returned $code"; fi
          done
          code=$(curl -sk -o /dev/null --max-time 20 -w '%{http_code}' "https://$SITE/no-such-page")
          if [ "$code" = 404 ]; then ok "missing pages return 404"; else bad "missing page returned $code"; fi
          for p in /mail-filter/filter.php /mail-filter/config.php /tools/build.py /tools/crest/crest.js /README.md; do
            code=$(curl -sk -o /dev/null --max-time 20 -w '%{http_code}' "https://$SITE$p")
            if [ "$code" = 404 ]; then ok "$p is not published"; else bad "$p is publicly reachable ($code)"; fi
          done

          echo "== Mixed content"
          if grep -Eo '(src|href)="http://[^"]+' <<<"$home"; then bad "page references insecure http:// resources"; else ok "no insecure http:// resources"; fi

          exit $fail
