name: Student application end-to-end checks

on:
  push:
    branches:
      - main
      - fix/student-language-header-overlap-20261021
  pull_request:
    paths:
      - 'students.html'
      - 'assets/student.css'
      - 'assets/student.js'
      - 'assets/style.css'
      - 'assets/main.js'
      - 'tests/e2e/**'
      - 'playwright.config.cjs'
      - '.github/workflows/student-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Run student experience tests
        run: |
          mkdir -p test-screenshots
          npx playwright test --config=playwright.config.cjs
      - name: Install WebKit browser dependencies
        run: npx playwright install --with-deps webkit
      - name: Test iOS Safari-equivalent browser
        run: npx playwright test --config=playwright.config.cjs --browser webkit --grep 'iphone-390|student enquiry offers complete email fallback|student email fallback disappears on successful retry|language switching'
      - name: Attach QA screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownsmere-student-e2e
          path: |
            playwright-report/
            test-results/
            test-screenshots/
          retention-days: 7
