name: Website end-to-end checks

on:
  push:
    branches:
      - main
      - fix/crownsmere-visual-refinement-20261021
      - fix/student-language-header-overlap-20261021
      - improve/crownsmere-ux-mobile-20261021
  pull_request:
    paths:
      - '*.html'
      - 'assets/**'
      - 'tools/build.py'
      - 'tests/e2e/**'
      - '.htmlvalidate.json'
      - 'playwright.config.cjs'
      - '.github/workflows/student-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-e2e:
    runs-on: ubuntu-24.04
    # Three browsers are installed and tested one after another. On slow days GitHub's package
    # mirrors alone have taken over 25 minutes, which stopped the job before WebKit and Firefox ran.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner and HTML validator
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps @playwright/test@1.56.1 html-validate@10.17.0
      - name: Validate the HTML of every page
        run: npx html-validate *.html
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Run every website test in Chromium (layout, page length, links, forms, accessibility)
        run: |
          mkdir -p test-screenshots
          npx playwright test --config=playwright.config.cjs
      # The later steps run even if an earlier one fails, so every browser engine is reported.
      - name: Install WebKit and Firefox
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps webkit firefox
      - name: Run every website test in WebKit (the Safari and iPhone engine)
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.config.cjs --browser webkit
      - name: Run every website test in Firefox
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.config.cjs --browser firefox
      - name: Attach QA screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownsmere-e2e
          path: |
            playwright-report/
            test-results/
            test-screenshots/
          retention-days: 7
