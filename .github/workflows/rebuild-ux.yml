name: Rebuild Crownsmere visual UX pages

on:
  push:
    branches:
      - main
      - fix/crownsmere-visual-refinement-20261021
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and regenerate website
        run: |
          python3 -m py_compile tools/build.py
          python3 tools/build.py
          git diff --check
          git diff --stat
      - name: Commit generated public pages
        run: |
          git config user.name "Crownsmere Site Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html about.html contact.html privacy.html 404.html sitemap.xml robots.txt site.webmanifest
          if git diff --cached --quiet; then
            echo "Generated pages are already current"
            exit 0
          fi
          git commit -m "Regenerate photo-led Crownsmere HTML and navigation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
