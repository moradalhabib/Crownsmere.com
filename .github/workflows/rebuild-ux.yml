name: Rebuild Crownsmere visual UX pages

on:
  push:
    branches:
      - main
      - fix/crownsmere-visual-refinement-20261021
      - feature/mobbin-property-portfolio-20261104
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and regenerate website
        run: |
          python3 -m py_compile tools/build.py tools/property_pages.py
          python3 tools/test_properties.py
          python3 tools/build.py
          git diff --check
          git diff --stat
      - name: Commit generated public pages
        run: |
          git config user.name "Crownsmere Site Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html properties.html services.html buy.html sell.html rent.html invest.html advisory.html about.html students.html students-ar.html contact.html privacy.html 404.html sitemap.xml robots.txt site.webmanifest *.txt
          # Stage existing generated detail pages and additions; no-op when catalogue is empty.
          git ls-files -z 'property-*.html' | xargs -0 -r git add -u --
          find . -maxdepth 1 -name 'property-*.html' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "Generated pages are already current"
            exit 0
          fi
          git commit -m "Regenerate Crownsmere HTML pages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
