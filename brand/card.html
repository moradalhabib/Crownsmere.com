<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Crownsmere Estate business card (print, 85 x 55 mm with 3 mm bleed)</title>
<style>@font-face { font-family: "Inter"; font-style: normal; font-weight: 400; src: url(".fonts/inter-latin-400.ttf") format("truetype"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 500; src: url(".fonts/inter-latin-500.ttf") format("truetype"); }
@font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 400; src: url(".fonts/cormorant-garamond-400.ttf") format("truetype"); }
@font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 500; src: url(".fonts/cormorant-garamond-500.ttf") format("truetype"); }
@font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 400; src: url(".fonts/cormorant-garamond-italic-400.ttf") format("truetype"); }
@font-face { font-family: "Cinzel"; font-style: normal; font-weight: 500; src: url(".fonts/cinzel-500.ttf") format("truetype"); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.card { position: relative; width: 91mm; height: 61mm; overflow: hidden; }
.safe { position: absolute; top: 7mm; right: 7mm; bottom: 7mm; left: 7mm; }

.front { background: radial-gradient(120% 95% at 50% 36%, #182c47 0%, #0e1b2e 64%); }
.front .safe { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.front img { display: block; height: 21mm; width: auto; }
.wm { margin: 3.4mm 0 0; padding-left: 0.16em; font: 500 12.5pt/1 "Cinzel", serif; letter-spacing: 0.16em; color: #ecd6aa; }
.wm-sub { margin: 1.8mm 0 0; padding-left: 0.52em; font: 500 5.2pt/1 "Inter", sans-serif; letter-spacing: 0.52em; color: #c4a46e; }

.back { background: #faf7f1; color: #0e1b2e; }
.back .safe { display: flex; justify-content: space-between; }
.who { display: flex; flex-direction: column; justify-content: space-between; }
.name { margin: 0; font: 500 17pt/1 "Cormorant Garamond", serif; }
.role { margin: 1.7mm 0 0; font: 500 5.4pt/1 "Inter", sans-serif; letter-spacing: 0.16em; color: #80612f; }
.rule { width: 9mm; height: 0.25mm; margin: 3.4mm 0 3mm; background: #b08d57; }
.lines { margin: 0; font: 400 7pt/1.6 "Inter", sans-serif; color: #0e1b2e; }
.tag { margin: 0; font: 400 9.5pt/1.15 "Cormorant Garamond", serif; color: #4a5263; }
.tag em { color: #80612f; }
.side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
/* Negative right margins cancel the letter spacing after the last letter, so both lines end flush with the QR code. */
.brand { margin: 0 -0.92pt 0 0; text-align: right; font: 500 6.6pt/1 "Cinzel", serif; letter-spacing: 0.14em; color: #0e1b2e; }
.brand small { display: block; margin: 1.1mm -0.92pt 0 0; font: 500 4.4pt/1 "Inter", sans-serif; letter-spacing: 0.42em; color: #80612f; }
.qr { display: flex; flex-direction: column; align-items: center; }
.qr svg { display: block; width: 17mm; height: 17mm; }
.qr p { margin: 1.6mm 0 0; font: 500 4.8pt/1 "Inter", sans-serif; letter-spacing: 0.14em; color: #5c6270; }

@page { size: 91mm 61mm; margin: 0; }
.card { break-after: page; }
.card:last-child { break-after: auto; }
@media screen { body { background: #888; padding: 10mm; } .card { margin-bottom: 8mm; } }
</style></head>
<body>
<div class="card front"><div class="safe">
  <img src="../assets/img/monogram.png" alt="">
  <p class="wm">CROWNSMERE</p>
  <p class="wm-sub">ESTATE</p>
</div></div>
<div class="card back"><div class="safe">
  <div class="who">
    <div>
      <p class="name">Alaa Qadir</p>
      <p class="role">SENIOR PROPERTY CONSULTANT</p>
      <div class="rule"></div>
      <p class="lines">hello@crownsmere.com<br>crownsmere.com</p>
    </div>
    <p class="tag">London property, <em>personally handled.</em></p>
  </div>
  <div class="side">
    <p class="brand">CROWNSMERE<small>ESTATE</small></p>
    <div class="qr"><svg viewBox="0 0 25 25" class="segno"><path class="qrline" stroke="#0e1b2e" d="M0 0.5h7m1 0h1m2 0h1m1 0h2m3 0h7m-25 1h1m5 0h1m3 0h3m1 0h1m3 0h1m5 0h1m-25 1h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m2 0h1m1 0h3m2 0h1m1 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m2 0h1m2 0h1m1 0h1m3 0h1m1 0h3m1 0h1m-25 1h1m5 0h1m1 0h7m1 0h1m1 0h1m5 0h1m-25 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-9 1h1m-17 1h1m1 0h1m3 0h2m2 0h1m4 0h2m2 0h1m2 0h1m1 0h1m-25 1h1m3 0h2m4 0h1m1 0h1m2 0h5m1 0h1m1 0h2m-24 1h1m2 0h1m1 0h3m1 0h1m3 0h2m1 0h2m2 0h2m1 0h1m-25 1h1m2 0h3m4 0h3m1 0h1m1 0h1m1 0h1m2 0h1m-22 1h1m1 0h2m2 0h2m8 0h1m1 0h2m4 0h1m-24 1h2m1 0h1m2 0h3m3 0h1m1 0h2m1 0h2m3 0h2m-25 1h2m1 0h1m2 0h1m1 0h4m3 0h1m5 0h2m1 0h1m-23 1h1m2 0h1m2 0h1m5 0h2m1 0h5m-22 1h13m2 0h6m2 0h1m-16 1h3m1 0h2m1 0h2m3 0h1m3 0h1m-25 1h7m1 0h3m1 0h2m2 0h1m1 0h1m1 0h1m3 0h1m-25 1h1m5 0h1m2 0h4m1 0h3m3 0h1m2 0h2m-25 1h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h7m3 0h1m-25 1h1m1 0h3m1 0h1m2 0h1m3 0h1m2 0h2m2 0h1m1 0h2m-24 1h1m1 0h3m1 0h1m1 0h1m2 0h2m6 0h3m1 0h2m-25 1h1m5 0h1m3 0h1m3 0h1m1 0h2m1 0h2m-21 1h7m1 0h1m2 0h4m1 0h1m4 0h1m2 0h1"/></svg><p>SCAN TO VISIT</p></div>
  </div>
</div></div>
</body></html>
